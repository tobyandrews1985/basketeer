# Smithery config — lists the npm-published stdio MCP server.
# https://smithery.ai  ·  the bin is `basketeer-mcp` under the `basketeer` package.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      market:
        type: string
        enum: ["uk", "cz"]
        default: "uk"
        description: Tesco storefront (UK, or Czech Republic, which is experimental and community-maintained).
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "-p", "basketeer", "basketeer-mcp"],
      env: { TESCO_MARKET: config.market ?? "uk" }
    })
